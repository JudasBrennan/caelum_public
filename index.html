    />

      name="twitter:image"
      content="https://thebrokenwheel.co.uk/caelum/assets/worldsmith.png"

  </head>
  <body>
    <noscript>
      <div
        style="
          max-width: 600px;
          margin: 40px auto;
          padding: 20px;
          font-family: system-ui, sans-serif;
        "
      >
        <h1>Caelum - Ex Nihilo, Astra</h1>
        <p>
          Caelum is a free browser-based toolkit for worldbuilders. Design stars, planetary systems,
          moons, climates, calendars, and more - all grounded in real astrophysics.
        </p>
        <p>This application requires JavaScript to run. Please enable JavaScript and reload.</p>
      </div>
    </noscript>

    <header class="app-header">
      <button
        class="nav-hamburger"
        id="navHamburger"
        aria-label="Open navigation"
        aria-controls="primaryNav"
        aria-expanded="false"
      >
        &#9776;
      </button>
      <div class="brand">
        <div class="brand__mark">C</div>
        <div class="brand__text">
          <div class="brand__title">Caelum</div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div class="nav-backdrop" id="navBackdrop" aria-hidden="true"></div>
      <div class="app-alerts" id="appAlerts" aria-live="polite"></div>
      <aside class="side-nav is-collapsed" id="primaryNav" aria-label="Sections">
        <div class="side-nav__brand">
          <div class="brand__mark">C</div>
          <div class="side-nav__brand-text">
            <div class="brand__title">Caelum</div>
          </div>
        </div>

        <div class="side-nav__scroll">
          <div class="side-nav__group">
            <div class="side-nav__label">Cosmos</div>
            <a class="side-nav__item" href="#/star" title="Star"
              ><span class="ws-icon icon--star" aria-hidden="true"></span
              ><span class="side-nav__item-label">Star</span></a
            >
            <a class="side-nav__item" href="#/system" title="Planetary System"
              ><span class="ws-icon icon--system" aria-hidden="true"></span
              ><span class="side-nav__item-label">Planetary System</span></a
            >
            <a class="side-nav__item" href="#/cluster" title="Local Cluster"
              ><span class="ws-icon icon--local-cluster" aria-hidden="true"></span
              ><span class="side-nav__item-label">Local Cluster</span></a
            >
          </div>

          <div class="side-nav__group">
            <div class="side-nav__label">Bodies</div>
            <a class="side-nav__item" href="#/planet" title="Planets"
              ><span class="ws-icon icon--inner-planets" aria-hidden="true"></span
              ><span class="side-nav__item-label">Planets</span></a
            >
            <a class="side-nav__item" href="#/moon" title="Moons"
              ><span class="ws-icon icon--moons" aria-hidden="true"></span
              ><span class="side-nav__item-label">Moons</span></a
            >
            <a class="side-nav__item" href="#/outer" title="Other Objects"
              ><span class="ws-icon icon--outer-objects" aria-hidden="true"></span
              ><span class="side-nav__item-label">Other Objects</span></a
            >
          </div>

          <div class="side-nav__group">
            <div class="side-nav__label">Surface</div>
            <a class="side-nav__item" href="#/tectonics" title="Tectonics"
              ><span class="ws-icon icon--tectonics" aria-hidden="true"></span
              ><span class="side-nav__item-label">Tectonics</span></a
            >
            <a class="side-nav__item" href="#/climate" title="Climate Zones"
              ><span class="ws-icon icon--climate" aria-hidden="true"></span
              ><span class="side-nav__item-label">Climate Zones</span></a
            >
            <a class="side-nav__item" href="#/population" title="Population"
              ><span class="ws-icon icon--population" aria-hidden="true"></span
              ><span class="side-nav__item-label">Population</span></a
            >
          </div>

          <div class="side-nav__group">
            <div class="side-nav__label">Time &amp; Light</div>
            <a class="side-nav__item" href="#/calendar" title="Calendar"
              ><span class="ws-icon icon--calendar" aria-hidden="true"></span
              ><span class="side-nav__item-label">Calendar</span></a
            >
            <a class="side-nav__item" href="#/apparent" title="Apparent Size"
              ><span class="ws-icon icon--apparent" aria-hidden="true"></span
              ><span class="side-nav__item-label">Apparent Size</span></a
            >
          </div>

          <div class="side-nav__group">
            <div class="side-nav__label">Tools</div>
            <a class="side-nav__item" href="#/viz" title="Visualiser"
              ><span class="ws-icon icon--visualiser" aria-hidden="true"></span
              ><span class="side-nav__item-label">Visualiser</span></a
            >
            <a class="side-nav__item" href="#/science" title="Science &amp; Maths"
              ><span class="ws-icon icon--science" aria-hidden="true"></span
              ><span class="side-nav__item-label">Science &amp; Maths</span></a
            >
            <a class="side-nav__item" href="#/validation" title="Validation"
              ><span class="ws-icon icon--validation" aria-hidden="true"></span
              ><span class="side-nav__item-label">Validation</span></a
            >
            <a class="side-nav__item" href="#/lessons" title="Lessons"
              ><span class="ws-icon icon--lessons" aria-hidden="true"></span
              ><span class="side-nav__item-label">Lessons</span></a
            >
          </div>

          <div class="side-nav__group">
            <a class="side-nav__item" href="#/io" title="Import/Export"
              ><span class="ws-icon icon--import-export" aria-hidden="true"></span
              ><span class="side-nav__item-label">Import/Export</span></a
            >
            <a class="side-nav__item" href="#/about" title="About Caelum"
              ><span class="ws-icon icon--about" aria-hidden="true"></span
              ><span class="side-nav__item-label">About Caelum</span></a
            >
          </div>
        </div>

        <div class="side-nav__expand-hint" aria-hidden="true">&raquo;</div>

        <div class="side-nav__footer">
          <a
            class="discord-link"
            href="http://discord.gg/aZzaR3DjsG"
            target="_blank"
            rel="noopener noreferrer"
            title="Join our Discord"
            ><img class="discord-link__icon" src="./assets/icons/discord.svg" alt="Discord"
          /></a>
          <label class="splash-toggle" for="splashToggle" title="Enable splash screen at startup">
            <input
              id="splashToggle"
              class="splash-toggle__input"
              type="checkbox"
              aria-label="Enable splash screen at startup"
            />
            <span class="splash-toggle__label">Splash</span>
          </label>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
            <span class="theme-toggle__sun">&#9788;</span>
            <span class="theme-toggle__moon">&#9789;</span>
          </button>
          <button
            class="nav-view-toggle"
            id="navViewToggle"
            type="button"
            aria-label="Collapse navigation"
            title="Collapse navigation"
          >
            &laquo;
          </button>
          <span id="versionTag" class="version-tag">3.0.0</span>
        </div>
      </aside>

      <section class="content" id="app"></section>
      <footer class="app-footer">Judas Brennan &middot; 2026</footer>
    </main>

    <script type="module" src="./app.js?release=3.0.0"></script>
